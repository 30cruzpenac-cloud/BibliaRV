<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblia Reina-Valera</title>
</head>
<body>

<h1>📖 Biblia Reina-Valera</h1>

<div id="contenido"></div>

<script>

const libros = [
"Génesis",
"Éxodo",
"Levítico",
"Números",
"Deuteronomio",
"Josué",
"Jueces",
"Rut",
"1 Samuel",
"2 Samuel",
"Mateo",
"Marcos",
"Lucas",
"Juan",
"Hechos",
"Romanos",
"Apocalipsis"
];

let html = "<h2>Libros</h2>";

for(let i=0;i<libros.length;i++){
html += "<p>" + libros[i] + "</p>";
}

document.getElementById("contenido").innerHTML = html;

</script>

</body>
</html>

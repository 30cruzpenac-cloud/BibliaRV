<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblia Reina-Valera</title>

<style>
body{
    font-family:Arial,sans-serif;
    padding:20px;
}

button{
    padding:10px;
    margin:5px;
    cursor:pointer;
}

.libro{
    cursor:pointer;
    color:blue;
}
</style>

</head>
<body>

<h1>📖 Biblia Reina-Valera</h1>

<button onclick="mostrarLibros()">
Comenzar
</button>

<div id="contenido"></div>

<script>

function mostrarLibros(){

document.getElementById("contenido").innerHTML = `
<h2>📖 Libros</h2>

<ul>
<li class="libro" onclick="mostrarCapitulos('Génesis',50)">Génesis</li>
<li class="libro" onclick="mostrarCapitulos('Éxodo',40)">Éxodo</li>
<li class="libro" onclick="mostrarCapitulos('Levítico',27)">Levítico</li>
<li class="libro" onclick="mostrarCapitulos('Números',36)">Números</li>
<li class="libro" onclick="mostrarCapitulos('Deuteronomio',34)">Deuteronomio</li>
<li class="libro" onclick="mostrarCapitulos('Mateo',28)">Mateo</li>
<li class="libro" onclick="mostrarCapitulos('Marcos',16)">Marcos</li>
<li class="libro" onclick="mostrarCapitulos('Lucas',24)">Lucas</li>
<li class="libro" onclick="mostrarCapitulos('Juan',21)">Juan</li>
<li class="libro" onclick="mostrarCapitulos('Apocalipsis',22)">Apocalipsis</li>
</ul>
`;
}

function mostrarCapitulos(libro,total){

let html = `<h2>${libro}</h2>`;

for(let i=1;i<=total;i++){
html += `<button>${i}</button>`;
}

document.getElementById("contenido").innerHTML = html;

}

</script>

</body>
</html>

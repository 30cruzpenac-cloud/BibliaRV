<head>

<title>📖 Biblia Reina-Valera</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
padding:20px;
}

header{
text-align:center;
margin-bottom:20px;
}

header h1{
color:#1e3a8a;
font-size:36px;
}

header p{
color:#666;
}

#buscar{
width:100%;
max-width:400px;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
margin-top:15px;
font-size:16px;
}

#acciones{
margin-top:15px;
}

button{
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
background:#2563eb;
color:white;
font-weight:bold;
margin:3px;
}

button:hover{
background:#1d4ed8;
}

#contenido{
margin-top:25px;
}

.libro{
background:white;
padding:15px;
margin-bottom:10px;
border-radius:12px;
cursor:pointer;
box-shadow:0 2px 8px rgba(0,0,0,0.10);
transition:.3s;
}

.libro:hover{
transform:translateY(-2px);
}

.capitulo{
width:60px;
margin:4px;
}

.oscuro{
background:#111827;
color:white;
}

.oscuro .libro{
background:#1f2937;
color:white;
}

.oscuro #buscar{
background:#1f2937;
color:white;
border:1px solid #444;
}

</style>
</head>
